<button type="button" class="pagar-btn" (click)="abrir()">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
    <path fill="currentColor" d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm8-2h2v2h-2v-2zm2 2h2v2h-2v-2zm2-2h2v2h-2v-2zm2 2h2v2h-2v-2zm-6 2h2v2h-2v-2zm2 2h2v2h-2v-2zm2-2h2v2h-2v-2zm2 2h2v2h-2v-2z"/>
  </svg>
  Pagar con QR
</button>

<dialog #dialogo class="hoja" aria-labelledby="pago-qr-titulo" (click)="alClicDialogo($event)">
  <div class="hoja-contenido">
    <div class="hoja-asa" aria-hidden="true"></div>
    <div class="hoja-header">
      <h3 id="pago-qr-titulo">Pagar con QR</h3>
      <button type="button" class="cerrar-btn" (click)="cerrar()" aria-label="Cerrar">✕</button>
    </div>
    <p class="hoja-texto">Escanea el código desde la app de tu banco o descárgalo para subirlo desde tu galería.</p>

    <div class="qr-marco">
      @if (!imagenFallo()) {
        <img [src]="imagenUrl" alt="Código QR de pago" loading="lazy" (error)="imagenFallo.set(true)" />
      } @else {
        <div class="qr-error">
          No se pudo cargar el QR.
          <a [href]="driveUrl" target="_blank" rel="noopener">Ábrelo en Google Drive</a>
        </div>
      }
    </div>

    <a class="descargar-btn" [href]="descargaUrl" target="_blank" rel="noopener">Descargar QR</a>
  </div>
</dialog>
